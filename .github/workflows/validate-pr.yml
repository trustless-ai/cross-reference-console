name: validate-pr
# The mechanical review NODES.md promises, as public CI — parse + conformance +
# checkable keys. If this is green, a registry/cell PR merges; no other approval step.
on:
  # Runs on EVERY pull request, deliberately unfiltered.
  #
  # It was path-filtered to nodes.json / cells / claims / reference, which was
  # right while it was advisory: a docs-only PR skipped it and that was fine.
  # It stops being right the moment the check is REQUIRED for merge -- a
  # required check that never runs leaves the PR pending forever, so the
  # filter would silently block exactly the PRs it was meant to spare.
  #
  # The suite is seconds long. Running it on a docs PR costs nothing and means
  # "green" has one meaning rather than two.
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # genesis + activation commits are DERIVED from history, not recorded
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # The mapping from lineage state to what a human sees. It had no test while it lived
      # inline in a DOM branch, and the branch was guarded by `if (lin)`, so a null state —
      # which linClaimState returns with fewer than two lanes — rendered no marker at all.
      - name: lineage marker — no state renders as an unqualified green
        run: bun ui/lineage-marker.test.ts

      # A suite nobody has watched fail is worth nothing. Reintroduce the exact defect that
      # shipped and require the tests to catch it.
      - name: negative control — the fail-open must be caught
        run: |
          cp ui/lineage-marker.js /tmp/lm.bk
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("ui/lineage-marker.js"); t = p.read_text()
          t = t.replace(
              "    if (lin === null || lin === undefined) {\n      return unproven('lineage state unavailable",
              "    if (lin === null || lin === undefined) {\n      return { state:'', addClass:[], removeClass:[], tail:'', qualified:true };\n    }\n    if (false) {\n      return unproven('lineage state unavailable",
              1)
          p.write_text(t)
          PY
          set +e
          bun ui/lineage-marker.test.ts > /tmp/neg.out 2>&1
          rc=$?
          set -e
          cp /tmp/lm.bk ui/lineage-marker.js
          if [ "$rc" -eq 0 ]; then
            echo "::error::the tests passed against the defect they exist to catch"; cat /tmp/neg.out; exit 1
          fi
          grep -q "null -> NOT PROVEN, never a bare green" /tmp/neg.out || { echo "::error::red, but not on the regression case"; cat /tmp/neg.out; exit 1; }
          echo "negative control caught the fail-open (exit $rc)"

      - name: deps (eip712 recover + keccak only — everything else is stdlib)
        run: pip install --quiet eth-account pycryptodome
      - name: gate conformance suite (negative vector per predicate)
        run: |
          python3 reference/test_gate.py
          # artifact_type is claim-bearing and is fixed by the lift rule, never
          # copied from the source. "Reconciling" the two would move claim_id and
          # break every edge on that claim — this pins the consequence.
          python3 reference/test_gate.py --axes
      - name: nodes.json — crc.nodes.v0
        run: python3 reference/validate_nodes.py
      - name: every cell verifies under its envelope + the registry
        run: |
          found=0
          while IFS= read -r f; do
            found=1
            echo "::group::$f"
            python3 reference/validate_cell.py "$f"
            echo "::endgroup::"
          done < <(find cells -name '*.cell.json' -not -path 'cells/rejected/*' 2>/dev/null)
          [ "$found" = "1" ] || echo "no cells yet"
      - name: schema sunset — new Cells must match in-force schema
        run: |
          git fetch --no-tags --depth=0 origin "${{ github.base_ref }}" || git fetch origin "${{ github.base_ref }}"
          python3 reference/check_sunset.py "origin/${{ github.base_ref }}" HEAD
      - name: registry identity is derivable and stable
        run: python3 reference/registry_id.py
      - name: registry_id refuses a truncated history (never a wrong identity)
        run: python3 reference/registry_id.py --selftest
      - name: source projection — stable across drift, sensitive to substance
        run: |
          # inputs[].content_hash on a live endpoint is provenance of one fetch,
          # not a value two nodes can compare. The projection is what they compare.
          python3 reference/projection.py --selftest
      - name: CELL-IN-FORCE.md is not stale
        run: |
          # The generated in-force view is derived by BUILDING a conforming Cell
          # and recording what was demanded of it. If the enforced format changes
          # and this file doesn't, the newcomer-facing answer silently becomes
          # wrong -- which is the drift a hand-written unified spec would have.
          python3 reference/gen_in_force.py --check
          python3 reference/gen_in_force.py --selftest
      - name: LineageRef grammar — negative vector per rule
        run: python3 reference/lineage_ref.py
      - name: cell admission — deferred v3 activation vectors
        run: python3 reference/test_cell_admission.py
      - name: create_cell.py loads (the tool an outsider onboards with)
        run: |
          # A create tool that has broken imports fails silently for everyone
          # EXCEPT us, because nothing in this repo's tests exercises it.
          python3 reference/create_cell.py --help > /dev/null
      - name: lineage graph — CELL-v3 §4 transitivity, cycles, unresolved refs
        run: |
          # §4 marks its own prose [PENDING-VECTOR] until these run here. This
          # is what makes the lineage section normative rather than aspirational.
          python3 reference/test_lineage_graph.py
          python3 reference/lineage_graph.py > /dev/null
      - name: lane distinctness — the edge rule's predicate, derived not labelled
        run: |
          python3 reference/test_lane_distinctness.py
          python3 reference/check_lane_distinctness.py
      - name: pin rule — negative matrix (signature binding + record vectors)
        run: |
          # Asked for in review: these vectors lived in a terminal, which is the
          # same defect as a conformance claim nobody can re-run.
          python3 reference/test_verify_pin.py
      - name: install ipfs (the pin check recomputes a real directory CID)
        run: |
          # Without this, check_pin_records reports amber on every record and the
          # step named 'every pin record reproduces its own CID' verifies no CID at
          # all. It passed green that way from the day it was added.
          V=0.30.0
          curl -sSL "https://dist.ipfs.tech/kubo/v${V}/kubo_v${V}_linux-amd64.tar.gz" -o /tmp/kubo.tgz
          tar -xzf /tmp/kubo.tgz -C /tmp
          sudo install /tmp/kubo/ipfs /usr/local/bin/ipfs
          # `ipfs add` needs an initialised repo even with -n (hash only, no
          # storage): without it, exit 1 -> the verifier reports amber. Installing
          # the binary alone is not the same as having a usable ipfs.
          ipfs init --profile=test
          ipfs --version
          # Prove the capability exists BEFORE the check depends on it, so a
          # broken install fails here rather than becoming an amber downstream.
          echo probe > /tmp/probe.txt
          ipfs add -Q -n --cid-version=1 /tmp/probe.txt
      - name: every pin record reproduces its own CID (structural, not signatures)
        run: |
          # test_verify_pin.py proves the VERIFIER is right. Nothing proved the
          # RECORDS were. A record whose CID did not recompute could merge and sit
          # there looking authoritative — and it is the artifact people sign
          # against, so a wrong one collects real signatures over a false claim.
          # Signatures are deliberately NOT asserted here: a record is supposed to
          # land unsigned and collect them after, and a check that is red by design
          # is one people learn to ignore.
          python3 reference/check_pin_records.py
      - name: the console page is the deterministic build of this commit
        run: |
          # Makes a submitted IPFS CID checkable: anyone can build main at a
          # stated commit and compare, instead of trusting whoever sent it.
          python3 reference/check_console_reproducible.py
      - name: the console names the in-force schema (it said v1 two versions on)
        run: |
          # The public console is the first thing a newcomer reads. Its join step
          # names the schema to sign, and that line went stale without any commit
          # touching it — correct when written, wrong by the time it mattered.
          # Derived now, and checked here so a hand-edit cannot silently undo it.
          python3 reference/check_console_schema.py
      - name: the console's lineage answer equals the reference implementation's
        run: |
          # ui/index.html carries a hand-ported copy of lineage_graph.py so the
          # page needs no server. Two implementations of one rule is exactly what
          # this repo exists to distrust, and the port would drift toward the
          # flattering answer — INDEPENDENT is what makes the matrix look strong.
          # Both run over the same embedded snapshot and must agree per claim.
          python3 reference/check_console_lineage.py
      - name: the rendered state is part of the asserted state (the Boardy rule)
        run: |
          # @boardyai, 15 Aug 2026: "a correct internal verdict with a collapsed or
          # missing UI marker is still a public falsehood, and vector tests cannot
          # catch it unless the rendered state is part of the asserted state."
          #
          # The state was already checked, and the mapping was checked in isolation.
          # Nothing tied a state to the exact text a reader sees, so the wording could
          # change — or quietly lose its qualifier — with every other check green.
          # Drives the SHIPPED ui/lineage-marker.js, never a copy, against a pinned
          # golden. A lost caveat therefore reads as a diff, not as silence.
          python3 reference/check_boardy_rule.py
      - name: and that check can actually go red
        run: |
          # Mutates the shipped mapping three ways — drop the qualifier flag, strip
          # "NOT PROVEN" from the text while leaving the flag true, change the wording
          # without updating the golden — and requires an exact exit 1 each time, plus
          # exit 2 (never 0) when it cannot check at all.
          python3 reference/test_check_boardy_rule.py

      # The currency mapping, gated BEFORE the console is allowed to read the resolver.
      # @boardyai: "vectors before the network read. A verification page should earn the
      # right to make a new claim before it gets another source of uncertainty."
      # The console still makes no network call; this is the contract it will have to meet.
      - name: the currency mapping holds
        run: python3 reference/check_currency_marker.py
      - name: and that check can fail for each assertion it makes
        run: |
          # Mutates the shipped mapping four ways and requires an exact exit 1 each time:
          # a reason manufacturing a verdict, three reasons collapsing into one amber,
          # green reachable from a failure, and UNDETERMINED surviving the boundary.
          python3 reference/test_check_currency_marker.py
      - name: every registered duplicate has a comparator that demonstrably bites
        run: |
          # Damon Zwicker's amendment: "name the module that decides rule X" is a
          # human audit unless recorded. rules.json records it; this enforces the
          # mechanical half — every sanctioned duplicate names a comparator, the
          # comparator is ACTUALLY RUN against a mutated copy, and it must fail.
          # A comparator that has never disagreed with anything is unverified in
          # exactly the way the [] / [] checker was.
          #
          # Also: vectors must cite the SPEC. The inversion survived because the
          # checker's own vectors encoded the same guess it did.
          python3 reference/check_rule_manifest.py
      - name: every claim file re-derives
        run: |
          python3 - <<'EOF'
          import json, os, sys
          sys.path.insert(0, 'reference')
          from claim_id import loads_strict, claim_id
          bad = 0
          for fn in sorted(os.listdir('claims')) if os.path.isdir('claims') else []:
              if not fn.endswith('.json') or fn.startswith('.'): continue
              d = loads_strict(open(os.path.join('claims', fn)).read())
              cid = claim_id(d['claim_preimage'])
              ok = cid == d['claim_id'] == 'sha256:' + fn[:-5]
              print(('ok  ' if ok else 'FAIL') + ' · ' + fn)
              bad += (not ok)
          sys.exit(1 if bad else 0)
          EOF
